name: livecheck
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Screenshot live site
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium || true
          mkdir -p _shots
          B="https://redesignbyasif.github.io/bekabuildingservicesltd.com/"
          CH=$(command -v chromium || command -v chromium-browser || command -v google-chrome)
          echo "using $CH"
          "$CH" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --screenshot=_shots/desktop.png "$B" || true
          "$CH" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=_shots/mobile.png "$B" || true
          ls -la _shots
      - name: Commit
        run: |
          git config user.name "livecheck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f _shots || true
          git commit -m "chore: live screenshots" || true
          git push origin HEAD:arena/e7b18c83-bekabuildingservicesltd-com || true
