name: livecheck
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify live site
        run: |
          BASE="https://redesignbyasif.github.io/bekabuildingservicesltd.com"
          OUT=livecheck.txt
          {
            echo "Live verification: $BASE"
            echo "date: $(date -u)"
            echo
            echo "== HTML"
            curl -s -o /tmp/live.html -w "status=%{http_code} bytes=%{size_download} type=%{content_type}\n" "$BASE/"
            echo "title: $(grep -o '<title>[^<]*' /tmp/live.html | head -1 | sed 's/<title>//')"
            echo "noindex: $(grep -c 'noindex' /tmp/live.html)"
            echo
            echo "== Assets referenced by the live HTML"
            grep -oE '(src|href|srcset)="[^"#]+"' /tmp/live.html | sed -E 's/^(src|href|srcset)="//; s/"$//' | sort -u | while read -r p; do
              case "$p" in
                http*|mailto:*|tel:*) continue;;
              esac
              printf "%-46s " "$p"
              curl -s -o /dev/null -w "%{http_code} %{size_download} %{content_type}\n" "$BASE/$p"
            done
            echo
            echo "== Local vs deployed checksum of key files"
            for f in index.html css/style.css js/script.js assets/logo/bbs-crest.webp assets/images/brand-engineer.webp assets/fonts/archivo-var.woff2; do
              local=$(sha256sum "$f" 2>/dev/null | cut -c1-16)
              remote=$(curl -s "$BASE/$f" | sha256sum | cut -c1-16)
              printf "%-40s local=%s remote=%s %s\n" "$f" "$local" "$remote" "$([ "$local" = "$remote" ] && echo MATCH || echo DIFF)"
            done
          } > $OUT 2>&1
          cat $OUT
      - name: Commit report
        run: |
          git config user.name "livecheck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add livecheck.txt
          git commit -m "chore: verify live Pages deployment" || true
          git push origin HEAD:arena/e7b18c83-bekabuildingservicesltd-com || true
