name: research-assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p _research
          curl -sSL --max-time 60 -A "Mozilla/5.0" "https://bekabuildingservicesltd.com/" -o _research/home.html
          ls -la _research > _research/log.txt
          wc -c _research/home.html >> _research/log.txt 2>&1
          head -c 400 _research/home.html >> _research/log.txt 2>&1
          grep -oE 'https://bekabuildingservicesltd\.com/wp-content/uploads/[^"'\'' )]+' _research/home.html | sort -u > _research/urls.txt || true
          wc -l _research/urls.txt >> _research/log.txt
      - name: Push
        run: |
          git config user.name "research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "research: original site snapshot" || true
          git push origin HEAD:arena/e7b18c83-bekabuildingservicesltd-com > _research/push.txt 2>&1 || true
          cat _research/push.txt
